<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Basics -->
  <title>FastSave - تنزيل ستوريات وفيديوهات مجاناً وبدون علامة مائية</title>
  <meta name="description" content="أسرع أداة أونلاين لتنزيل الفيديوهات والستوريات من تيك توك، إنستغرام، يوتيوب، وفيسبوك بأعلى جودة HD وبدون علامة مائية مجاناً.">
  <link rel="canonical" href="https://sastsave.vercel.app/" />
  
  <!-- Google Verification -->
  <meta name="google-site-verification" content="alqQlMQkk46K23PBrmnaD9SaxqgGSUQiMEEtV11YQMY" />

  <!-- Scripts, Icons & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #db2777;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur fixed top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">FastSave</span>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-bold">
        مجاني 100%
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-28 pb-12 flex flex-col items-center">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight">
        تنزيل ستوريات وفيديوهات <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">مجاناً وبدون علامة مائية</span>
      </h1>
      <p class="text-slate-400 text-sm md:text-base">حمل من إنستغرام، تيك توك، وباقي المنصات بضغطة زر</p>
    </div>

    <!-- Input Form Box -->
    <div class="w-full bg-slate-800 p-3 md:p-4 rounded-2xl shadow-2xl border border-slate-700 mb-8">
      <form id="downloadForm" class="flex flex-col sm:flex-row gap-2">
        <input 
          type="url" 
          id="videoUrl"
          placeholder="ضع رابط الفيديو أو الستوري هنا..." 
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm md:text-base focus:outline-none focus:border-pink-500 text-white placeholder-slate-500"
        />
        <button 
          type="submit" 
          id="submitBtn"
          class="bg-gradient-to-r from-pink-500 via-red-500 to-amber-500 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-xl text-sm md:text-base flex items-center justify-center gap-2 active:scale-95 transition-all"
        >
          <div class="loader" id="btnLoader"></div>
          <i class="fa-solid fa-download" id="btnIcon"></i>
          <span id="btnText">تحميل الآن</span>
        </button>
      </form>
    </div>

    <!-- Result Box (Hidden by default) -->
    <div id="resultBox" class="hidden w-full bg-slate-800 rounded-2xl p-6 border border-slate-700 flex flex-col md:flex-row gap-6 items-center mb-8">
      <img id="videoThumb" src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=400" alt="Thumbnail" class="w-32 h-32 object-cover rounded-xl border border-slate-700">
      <div class="flex-1 text-center md:text-right space-y-4 w-full">
        <h3 class="font-bold text-slate-200 text-sm md:text-base">تم تجهيز روابط التحميل!</h3>
        <div id="downloadOptions" class="flex flex-col gap-3 w-full">
          <!-- Links will be added here -->
        </div>
      </div>
    </div>

  </main>

  <footer class="w-full border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© FastSave - جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    const form = document.getElementById('downloadForm');
    const urlInput = document.getElementById('videoUrl');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const btnLoader = document.getElementById('btnLoader');
    const resultBox = document.getElementById('resultBox');
    const optionsContainer = document.getElementById('downloadOptions');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let rawUrl = urlInput.value.trim();
      
      // حماية ضد الروابط الخاطئة التي تبدأ بـ /
      if (rawUrl.startsWith('/http')) rawUrl = rawUrl.substring(1);

      // حالة التحميل
      btnIcon.style.display = 'none';
      btnLoader.style.display = 'block';
      btnText.innerText = 'جاري التحميل...';
      submitBtn.disabled = true;
      resultBox.classList.add('hidden');
      optionsContainer.innerHTML = ''; // تنظيف النتائج السابقة

      try {
        let downloadLink = "";

        // المحرك 1: للإنستغرام (SnapInsta Proxy) - مستقر جداً
        if (rawUrl.includes('instagram.com')) {
          const response = await fetch('https://snapinsta.app/api/ajaxSearch', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest'
            },
            body: `q=${encodeURIComponent(rawUrl)}&vt=ig`
          });
          
          const htmlResult = await response.text();
          
          // استخراج أول رابط تحميل HD من كود HTML الراجع
          const match = htmlResult.match(/href="(https:\/\/[^"]+)"[^>]*>[\s\S]*?Download Video/i);
          if (match && match[1]) {
            downloadLink = match[1];
          }
        } 
        
        // المحرك 2: لتيك توك (TikWM)
        else if (rawUrl.includes('tiktok.com')) {
          const formData = new FormData();
          formData.append('url', rawUrl);
          const response = await fetch('https://www.tikwm.com/api/', {
            method: 'POST',
            body: formData
          });
          const resData = await response.json();
          if (resData.code === 0 && resData.data) {
            downloadLink = resData.data.play;
          }
        }

        // عرض النتيجة
        if (downloadLink) {
          optionsContainer.innerHTML = `
            <a href="${downloadLink}" target="_blank" rel="noopener noreferrer" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-center text-sm transition-colors flex items-center justify-center gap-2 shadow-lg">
              <i class="fa-solid fa-file-arrow-down"></i> اضغط هنا لتحميل الفيديو HD
            </a>
            <p class="text-xs text-slate-500 text-center">ملاحظة: إذا فتح الفيديو في صفحة جديدة، اضغط على النقاط الثلاث واختر "تحميل".</p>
          `;
          resultBox.classList.remove('hidden');
        } else {
          alert('تعذر استخراج الفيديو. يرجى التأكد من أن الرابط صحيح وأن الحساب عام (Public).');
        }

      } catch (error) {
        alert('حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى لاحقاً.');
        console.error(error);
      } finally {
        // إعادة حالة الزر
        btnIcon.style.display = 'block';
        btnLoader.style.display = 'none';
        btnText.innerText = 'تحميل الآن';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
