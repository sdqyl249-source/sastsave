<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>FastSave - تنزيل ستوريات وفيديوهات مجاناً وبدون علامة مائية</title>
  <meta name="description" content="أسرع أداة أونلاين لتنزيل الفيديوهات والستوريات من تيك توك، إنستغرام، يوتيوب، وفيسبوك بأعلى جودة HD مجاناً.">
  <link rel="canonical" href="https://sastsave.vercel.app/" />
  
  <meta name="google-site-verification" content="alqQlMQkk46K23PBrmnaD9SaxqgGSUQiMEEtV11YQMY" />

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>

  <!-- 📢 1. Popunder Ad (إعلان النوافذ المنبثقة المفعل) -->
  <script type='text/javascript' src='//pl30536069.effectivecpmnetwork.com/97/81/2a/97812a6f2bd64d57a922338a0653f538.js'></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur fixed top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">FastSave</span>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-bold">
        مجاني 100%
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-24 pb-12 flex flex-col items-center">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight">
        تنزيل ستوريات وفيديوهات <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">مجاناً وبدون علامة مائية</span>
      </h1>
      <p class="text-slate-400 text-sm md:text-base">حمل من إنستغرام، تيك توك، وباقي المنصات بضغطة زر</p>
    </div>

    <!-- 📢 2. Banner 728x90 Ad (إعلان بنر علوي) -->
    <div class="w-full my-4 flex justify-center items-center overflow-hidden min-h-[90px]">
      <script type="text/javascript">
        atOptions = {
          'key' : '291df70fc95b6f75599d9cf0d3022ad6',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://www.highperformanceformat.com/291df70fc95b6f75599d9cf0d3022ad6/invoke.js"></script>
    </div>

    <!-- Input Form Box -->
    <div class="w-full bg-slate-800 p-3 md:p-4 rounded-2xl shadow-2xl border border-slate-700 my-4">
      <form id="downloadForm" class="flex flex-col sm:flex-row gap-2">
        <input 
          type="url" 
          id="videoUrl"
          placeholder="ضع رابط الفيديو أو الستوري هنا..." 
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm md:text-base focus:outline-none focus:border-pink-500 text-white placeholder-slate-500"
        />
        <button 
          type="submit" 
          id="submitBtn"
          class="bg-gradient-to-r from-pink-500 via-red-500 to-amber-500 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-xl text-sm md:text-base flex items-center justify-center gap-2 active:scale-95 transition-all"
        >
          <i class="fa-solid fa-download"></i>
          <span id="btnText">تحميل الآن</span>
        </button>
      </form>
    </div>

    <!-- Result Box -->
    <div id="resultBox" class="hidden w-full bg-slate-800 rounded-2xl p-6 border border-slate-700 flex flex-col items-center text-center my-4">
      <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center text-2xl mb-3">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="font-bold text-slate-200 text-base mb-2">تم تجهيز الفيديو بنجاح!</h3>
      <p class="text-xs text-slate-400 mb-6">اضغط على الزر أدناه لبدء التحميل المباشر</p>
      
      <div id="downloadOptions" class="w-full max-w-md"></div>
    </div>

    <!-- 📢 3. Banner 300x250 Ad (إعلان بنر سفلي) -->
    <div class="w-full my-6 flex justify-center items-center overflow-hidden min-h-[250px]">
      <script type="text/javascript">
        atOptions = {
          'key' : '708cd9f4288ef2ee4853fe16ea23d5fe',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://www.highperformanceformat.com/708cd9f4288ef2ee4853fe16ea23d5fe/invoke.js"></script>
    </div>

  </main>

  <footer class="w-full border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© FastSave - جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    const form = document.getElementById('downloadForm');
    const urlInput = document.getElementById('videoUrl');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultBox = document.getElementById('resultBox');
    const optionsContainer = document.getElementById('downloadOptions');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let rawUrl = urlInput.value.trim();
      if (rawUrl.startsWith('/http')) rawUrl = rawUrl.substring(1);

      btnText.innerText = 'جاري المعالجة...';
      submitBtn.disabled = true;
      resultBox.classList.add('hidden');
      optionsContainer.innerHTML = '';

      try {
        if (rawUrl.includes('tiktok.com')) {
          const formData = new FormData();
          formData.append('url', rawUrl);
          const response = await fetch('https://www.tikwm.com/api/', { method: 'POST', body: formData });
          const resData = await response.json();

          if (resData.code === 0 && resData.data) {
            const videoUrl = resData.data.play;
            optionsContainer.innerHTML = `
              <a href="${videoUrl}" target="_blank" rel="noopener noreferrer" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg transition-all">
                <i class="fa-solid fa-download"></i> تحميل فيديو تيك توك HD
              </a>
            `;
            resultBox.classList.remove('hidden');
          } else {
            alert('تعذر جلب فيديو تيك توك، تأكد من صحة الرابط.');
          }
        } 
        else if (rawUrl.includes('instagram.com')) {
          const cleanIgUrl = encodeURIComponent(rawUrl);
          const redirectLink = `https://ddinstagram.com/viewer?url=${cleanIgUrl}`;
          
          optionsContainer.innerHTML = `
            <a href="${redirectLink}" target="_blank" rel="noopener noreferrer" class="block w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg transition-all">
              <i class="fa-solid fa-file-arrow-down"></i> فتح صفحة تحميل إنستغرام
            </a>
            <p class="text-[11px] text-slate-400 mt-2">سيتم فتح سيرفر التحميل المباشر في نافذة جديدة.</p>
          `;
          resultBox.classList.remove('hidden');
        } 
        else {
          alert('يرجى إدخال رابط صحيح من تيك توك أو إنستغرام.');
        }

      } catch (error) {
        alert('حدث خطأ أثناء الاتصال، يرجى المحاولة لاحقاً.');
      } finally {
        btnText.innerText = 'تحميل الآن';
        submitBtn.disabled = false;
      }
    });
  </script>

  <!-- 📢 4. Social Bar Ad (شريط إعلاني متحرّك أسفل الشاشة) -->
  <script type="text/javascript" src="https://pl30536082.effectivecpmnetwork.com/5e/ca/fb/5ecafbff1e6b00e7ec9ab2bd5f0fdbbe.js"></script>

</body>
