<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنزيل ستوريات وفيديوهات مجاناً | FastSave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur fixed top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">FastSave</span>
        <span class="hidden sm:inline-block text-xs text-slate-400 border border-slate-700 px-2 py-1 rounded-md">تنزيل ستوريات وفيديوهات مجاناً</span>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-bold">مجاني 100%</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-28 pb-12 flex flex-col items-center">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight">
        تنزيل ستوريات وفيديوهات <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-amber-400">مجاناً وبدون علامة مائية</span>
      </h1>
      <p class="text-slate-400 text-sm md:text-base">حمل من تيك توك، إنستغرام، يوتيوب، وفيسبوك بأعلى جودة وبضغطة زر</p>
    </div>

    <!-- Top Ad Slot -->
    <div class="w-full bg-slate-800/40 border border-slate-700/50 border-dashed rounded-xl p-3 mb-6 text-center text-xs text-slate-500 min-h-[90px] flex items-center justify-center">
      <span>[ مساحة إعلانية علوية ]</span>
    </div>

    <!-- Input Form Box -->
    <div class="w-full bg-slate-800 p-3 md:p-4 rounded-2xl shadow-2xl border border-slate-700 mb-8">
      <form id="downloadForm" class="flex flex-col sm:flex-row gap-2">
        <input 
          type="url" 
          id="videoUrl"
          placeholder="ضع رابط الفيديو أو الستوري هنا..." 
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm md:text-base focus:outline-none focus:border-pink-500 text-white placeholder-slate-500 transition-colors"
        />
        <button 
          type="submit" 
          id="submitBtn"
          class="bg-gradient-to-r from-pink-500 via-red-500 to-amber-500 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-xl text-sm md:text-base transition-all transform active:scale-95 shadow-lg shadow-pink-500/20 flex items-center justify-center gap-2"
        >
          <span id="btnText">تحميل الآن</span>
        </button>
      </form>
    </div>

    <!-- Result Box -->
    <div id="resultBox" class="hidden w-full bg-slate-800 rounded-2xl p-6 border border-slate-700 flex flex-col md:flex-row gap-6 items-center mb-8">
      <img id="videoThumb" src="" alt="Thumbnail" class="w-44 h-52 object-cover rounded-xl shadow-md border border-slate-700">
      <div class="flex-1 text-center md:text-right space-y-4 w-full">
        <h3 id="videoTitle" class="font-bold text-slate-200 line-clamp-2 text-sm md:text-base"></h3>
        <div id="downloadOptions" class="flex flex-col sm:flex-row gap-3 w-full"></div>
      </div>
    </div>

    <!-- Bottom Ad Slot -->
    <div class="w-full bg-slate-800/40 border border-slate-700/50 border-dashed rounded-xl p-4 text-center text-xs text-slate-500 min-h-[250px] flex items-center justify-center">
      <span>[ مساحة إعلانية سفلية ]</span>
    </div>

  </main>

  <footer class="w-full border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© FastSave - تنزيل ستوريات وفيديوهات مجاناً. جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    const form = document.getElementById('downloadForm');
    const urlInput = document.getElementById('videoUrl');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultBox = document.getElementById('resultBox');

    // المفتاح الخاص بك تم إدراجه هنا بنجاح
    const RAPID_API_KEY = 'b0b42f4875msh30ac79948a6a5bcp1e3ab1jsnb4a9c2d4f349'; 
    const RAPID_API_HOST = 'social-media-video-downloader.p.rapidapi.com';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      btnText.innerText = 'جاري الجلب...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`https://${RAPID_API_HOST}/smvd/get-video-url?url=${encodeURIComponent(url)}`, {
          method: 'GET',
          headers: {
            'x-rapidapi-key': RAPID_API_KEY,
            'x-rapidapi-host': RAPID_API_HOST
          }
        });

        const data = await response.json();

        if (response.ok && (data.download_url || data.url || data.links)) {
          const videoLink = data.download_url || data.url || (data.links && data.links[0]?.url);
          const thumb = data.picture || data.thumbnail || "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=400";
          const title = data.title || "تم جلب الفيديو بنجاح!";

          document.getElementById('videoThumb').src = thumb;
          document.getElementById('videoTitle').innerText = title;

          const optionsContainer = document.getElementById('downloadOptions');
          optionsContainer.innerHTML = `
            <a href="${videoLink}" target="_blank" download class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-center text-sm transition-colors flex items-center justify-center gap-2">
              📥 تحميل الفيديو HD
            </a>
          `;

          resultBox.classList.remove('hidden');
        } else {
          alert('تعذر استخراج رابط الفيديو، تأكد من صحة الرابط.');
        }

      } catch (error) {
        alert('حدث خطأ أثناء الاتصال بالخادم.');
      } finally {
        btnText.innerText = 'تحميل الآن';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
